<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* Soft Instagram-inspired pastel background */
            background: linear-gradient(
                135deg,
                #fbc2eb 0%,
                #a6c1ee 50%,
                #fad0c4 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .form-container {
            width: 100%;
            max-width: 480px;

            background: rgba(255, 255, 255, 0.94);

            padding: 35px;
            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(80, 60, 100, 0.20);

            backdrop-filter: blur(8px);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h1 {
            margin: 0;
            font-size: 28px;
            color: #5b4b6f;
        }

        .form-header p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #554c62;
        }

        .required::after {
            content: " *";
            color: #e75480;
        }

        input,
        select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d8cfe3;
            border-radius: 10px;

            background-color: #faf8fc;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #c084d8;

            box-shadow:
                0 0 0 3px rgba(192, 132, 216, 0.15);

            background-color: white;
        }

        .hint {
            margin-top: 5px;

            font-size: 12px;
            color: #888;
        }

        .submit-btn {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #c471ed,
                #f7797d
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(180, 100, 200, 0.25);
        }

        .footer-text {
            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: #999;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>Student Registration</h1>

            <p>
                Please fill in your information to register.
            </p>
        </div>

        <form action="#" method="POST">

            <!-- First Name -->
            <div class="form-group">

                <label for="firstName" class="required">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter your first name"
                    required
                >

            </div>


            <!-- Last Name -->
            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter your last name"
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email" class="required">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <!-- Mobile -->
            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10-15 digit number"
                    pattern="[0-9]{10,15}"
                    title="Please enter a valid mobile number containing 10 to 15 digits."
                >

                <div class="hint">
                    Format: 10 to 15 digits (numbers only)
                </div>

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label for="gender" class="required">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option value="" disabled selected>
                        Select your gender
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Date of Birth -->
            <div class="form-group">

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                >

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="submit-btn"
            >
                Register
            </button>

        </form>

        <div class="footer-text">
            All fields marked with * are mandatory.
        </div>

    </div>

</body>

</html>
